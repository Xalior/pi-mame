# Out Run (Sega, 1986). No media: the game lives entirely in its romset.
#
# The raster is the driver's own: segaorun.cpp sets the screen up as
# set_raw(25.1748_MHz_XTAL / 4, 400, 0, 320, 262, 0, 224) — 320x224 visible.
# Declaring it here makes that the virtual display MAME renders 1:1, and the
# shim's presentation core scales it onto the glass.
outrun --rapi-vfb=320x224
