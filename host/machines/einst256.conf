# Line Standard rides a DIP (S:1, MAME default 0x00 = 525 lines 60Hz).
# Porting rule: config follows the driver DIP defaults, so the declared
# canvas is NTSC. Flipping the DIP to 625/50 in MAME makes a PAL face the
# canvas no longer matches - recurate if that ever becomes the shipped set.
einst256 --virtual-resolution=720x480
