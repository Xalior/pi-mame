# Enduro Racer (Sega, 1986), Rev A, YM2151 sound board. No media: the game
# lives entirely in its romset.
#
# The main 68000 is an FD1089B encrypted CPU module. Its romset carries the
# dumped key (317-0013a.key) alongside the program ROMs and MAME decrypts
# through it at run time — nothing extra is needed here.
#
# The raster is the driver's own: enduror_base() derives from sharrier_base(),
# which derives from shared_base(), whose set_raw is
# 25.1748_MHz_XTAL / 4, 400, 0, 320, 262, 0, 224 — 320x224 visible.
enduror --rapi-vdisplay=320x224
