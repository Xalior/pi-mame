# Out Run (Sega, 1986), sitdown/upright, Rev A — the earlier program revision
# of the machine outrun.conf boots. No media: the game is entirely in its
# romset.
#
# Same board, so the same raster: outrun_base()'s
# set_raw(25.1748_MHz_XTAL / 4, 400, 0, 320, 262, 0, 224) — 320x224 visible.
outrunra --rapi-vdisplay=320x224
