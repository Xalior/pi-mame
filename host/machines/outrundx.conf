# Out Run (Sega, 1986), deluxe sitdown — the moving cabinet. No media: the
# game is entirely in its romset.
#
# Its sprite ROMs are 32 small EPROMs where the upright board uses 8 larger
# mask ROMs, but the video timing is unchanged, so the raster is the shared
# one: outrun_base()'s
# set_raw(25.1748_MHz_XTAL / 4, 400, 0, 320, 262, 0, 224) — 320x224 visible.
outrundx --rapi-vfb=320x224
