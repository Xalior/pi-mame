# Super Hang-On (Sega, 1987), sitdown/upright, unprotected. No media: the
# game lives entirely in its romset.
#
# The raster is the driver's own: segaorun.cpp's shangon() machine config
# sets the screen up as
# set_raw(25.1748_MHz_XTAL / 4, 400, 0, 320, 262, 0, 224) — 320x224 visible,
# the same geometry outrun_base() uses. Declaring it here makes that the
# virtual display MAME renders 1:1, which the shim's presentation core
# scales to the glass.
shangon --virtual-resolution=320x224
