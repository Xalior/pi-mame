# Space Harrier (Sega, 1985), Rev A. No media: the game lives entirely in
# its romset — including the internal program of the Intel 8751
# microcontroller fitted to the board as a protection device, which is
# dumped and carried as an ordinary romset member.
#
# The raster is the driver's own: sharrier_base() derives from
# shared_base(), whose set_raw is
# 25.1748_MHz_XTAL / 4, 400, 0, 320, 262, 0, 224 — 320x224 visible. Read from
# this machine's own path through the driver rather than carried over from
# Hang-On.
sharrier --virtual-resolution=320x224
