# Hang-On (Sega, 1985), Rev A. No media: the game lives entirely in its
# romset.
#
# The raster is the driver's own: every machine in segahang.cpp reaches
# shared_base(), which sets the screen up as
# set_raw(25.1748_MHz_XTAL / 4, 400, 0, 320, 262, 0, 224) — 320x224 visible,
# the same geometry the Out Run boards use. Declaring it here makes that the
# virtual display MAME renders 1:1, which the shim's presentation core scales
# to the glass.
hangon --virtual-resolution=320x224
