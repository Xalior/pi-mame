# Turbo Out Run (Sega, 1989), the Out Run upgrade set. No media: the game
# lives entirely in its romset.
#
# The main 68000 is an FD1094 encrypted CPU module. Its romset carries the
# dumped key (317-0118.key) alongside the program ROMs, and MAME decrypts
# through it at run time — nothing extra is needed here.
#
# The raster is the driver's own: toutrun runs on the outrun_fd1094 machine
# config, which derives from outrun_base() and sets the screen up as
# set_raw(25.1748_MHz_XTAL / 4, 400, 0, 320, 262, 0, 224) — 320x224 visible.
# Declaring it here makes that the virtual display MAME renders 1:1, which
# the shim's presentation core scales to the glass.
toutrun --virtual-resolution=320x224
